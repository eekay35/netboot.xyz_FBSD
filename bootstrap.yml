---
- hosts: "{{ target }}"
  gather_facts: false
  become: true
  become_method: su

  vars_prompt:
    - name: ansible_ssh_user
      prompt: "Enter SSH username"
      private: false
    - name: ansible_ssh_pass
      prompt: "\nEnter SSH password\nIf you're using keys, leave this empty"
      private: true
    - name: ansible_become_pass
      prompt: "\nEnter root/su password"
      private: true

  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  tasks:
    - name: "Bootstrap pkg"
      raw: pkg bootstrap -f -y
      changed_when: false
      tags: bootstrap

    - name: "Update pkg database"
      raw: pkg update -f
      changed_when: false
      tags: bootstrap

    - name: "Install python"
      raw: pkg install -y python3
      register: pkg_install_output
      changed_when: pkg_install_output.rc != 0
      tags: bootstrap
